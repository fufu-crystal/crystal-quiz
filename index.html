            --text: #2d2d2d;
            --text-light: #6b6b6b;

        .page { display: none; }
        .page.active { display: block; }

        .header {

            align-items: center;
            justify-content: center;
            padding: 20px 0 10px;
            gap: 10px;
        }
        .header img {
            height: 36px;
            width: auto;
        }
        .header .brand {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 2px;
        }

        /* Landing Page */
        .landing { text-align: center; padding-top: 20px; }
        .landing .hero-image {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .landing h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .landing .subtitle {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        .landing .intro-text {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            text-align: left;
        }
        .landing .intro-text p {
            margin-bottom: 10px;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: var(--accent-light);
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            max-width: 280px;
            font-weight: 500;
        }
        .btn:hover { background: #2d2d4e; }
        .btn:active { transform: scale(0.98); }

        /* Progress Bar */
        .progress { margin: 20px 0; }
        .progress-bar {
            height: 4px;
            background: #e8e4df;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .progress-text {
            text-align: center;
            color: var(--text-light);
            font-size: 0.8rem;
            margin-top: 6px;
        }

        /* Question Page */
        .question-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px 18px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .question-emoji {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .question-desc {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 20px;
        }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            background: var(--bg);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            -webkit-tap-highlight-color: transparent;

        .option:hover { border-color: var(--accent-light); }
        .option:active { transform: scale(0.98); }
        .option.selected {
            border-color: var(--accent);
            background: #faf6ef;

        .option-icon { font-size: 1.5rem; flex-shrink: 0; }
        .option-text { flex: 1; }
        .option-text .label { font-weight: 500; margin-bottom: 2px; font-size: 0.95rem; }
        .option-text .desc { font-size: 0.8rem; color: var(--text-light); }
        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            gap: 12px;
        }
        .btn-secondary {
            background: white;
            color: var(--text);
            border: 2px solid #e8e4df;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;

        .btn-secondary:hover { border-color: var(--accent); }
        .nav-btns .btn { flex: 1.5; }

        /* Result Page */
        .result { text-align: center; }
        .result-header { margin-bottom: 20px; }
        .result-header h2 { color: var(--primary); font-size: 1.3rem; margin-bottom: 6px; }
        .result-header p { color: var(--text-light); font-size: 0.85rem; }
        .result-summary {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            box-shadow: var(--shadow);

        .result-summary h4 { margin-bottom: 10px; color: var(--primary); font-size: 0.95rem; }
        .summary-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .summary-tag {
            background: var(--bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-light);

        .result-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            text-align: left;

            width: 100%;

        .result-card h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-card .tag {
            display: inline-block;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
        }
        .result-card .material {
            color: var(--accent);
            font-weight: 500;
            margin: 8px 0;
            font-size: 0.85rem;
        }
        .result-card .desc {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .share-tip {
            background: #faf6ef;
            border-radius: 12px;
            padding: 14px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-light);

            .header .brand { font-size: 1.3rem; }
            .landing { padding-top: 30px; }
            .landing h1 { font-size: 2rem; }
            .landing .subtitle { font-size: 1rem; margin-bottom: 40px; }
            .landing .intro-text { padding: 28px; }
            .landing .intro-text p { font-size: 1rem; }
            .btn { padding: 16px 56px; font-size: 1.1rem; width: auto; }
            .question-card { padding: 32px; }
            .question-emoji { font-size: 3rem; }
            .question-title { font-size: 1.4rem; }
            .question-desc { font-size: 0.95rem; }
            .options { gap: 14px; }
            .option { padding: 18px; }
            .result-header h2 { font-size: 1.6rem; }
            .result-card h3 { font-size: 1.2rem; }
            .result-card .material { font-size: 0.95rem; }
            .result-card .desc { font-size: 0.95rem; }
        }

        @media (min-width: 1024px) {
            .container { max-width: 800px; }

        }

</head>

                <button class="btn" onclick="startQuiz()">开始测试</button>

        <!-- Question Pages -->

                <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>

        </div>

        <!-- Result Page -->
        <div id="result" class="page"></div>

                options: [
                    { icon: '💸', label: '钱包鼓鼓', desc: '收入增加、财运亨通', value: 'rich' },
                    { icon: '🚀', label: '事业飞升', desc: '升职加薪、贵人相助', value: 'success' },
                    { icon: '🛡️', label: '百毒不侵', desc: '小人退散、邪气不近', value: 'safe' },
                    { icon: '😊', label: '天天开心', desc: '情绪稳定、自信满满', value: 'happy' },
                    { icon: '', label: '左右逢源', desc: '人缘爆棚、处处逢源', value: 'popular' }
                ],
                mapping: {
                    'rich': ['wealth-gather', 'confident-wealth', 'protect-wealth', 'steady-wealth'],
                    'success': ['career', 'wealth-noble', 'execution'],
                    'safe': ['protect-dark1', 'protect-dark2', 'purify'],
                    'happy': ['confidence', 'purify', 'people'],
                    'popular': ['people', 'wealth-noble', 'confidence']
                }
            },
            {
                id: 'intuition',
                emoji: '🔮',
                title: '最后，凭直觉选一张图',
                desc: '第一眼让你心动的',
                options: [
                    { icon: '🌅', label: '山水画', desc: '宁静致远', value: 'landscape' },
                    { icon: '🌊', label: '海浪图', desc: '波澜壮阔', value: 'wave' },
                    { icon: '🌺', label: '花卉图', desc: '生机盎然', value: 'flower' },
                    { icon: '🌌', label: '星空图', desc: '神秘浩瀚', value: 'starry' }
                ],
                mapping: {
                    'landscape': ['steady-wealth', 'career', 'purify'],
                    'wave': ['protect-dark2', 'wealth-gather', 'execution'],
                    'flower': ['people', 'wealth-noble', 'confidence'],
                    'starry': ['protect-dark1', 'confident-wealth', 'career']
                }
            }
        ];

        // ========== 逻辑控制区 ==========
        let currentQuestion = 0;
        let answers = {};

        function startQuiz() {
            document.getElementById('landing').classList.remove('active');
            document.getElementById('quiz').classList.add('active');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `第 ${currentQuestion + 1} / ${questions.length} 题`;

            const container = document.getElementById('questionContainer');
            container.innerHTML = `
                <div class="question-card">
                    <div class="question-emoji">${q.emoji}</div>
                    <div class="question-title">${q.title}</div>
                    <div class="question-desc">${q.desc}</div>
                    <div class="options">
                        ${q.options.map((opt) => `
                            <div class="option ${answers[q.id] === opt.value ? 'selected' : ''}" onclick="selectOption('${q.id}', '${opt.value}', this)">
                                <div class="option-icon">${opt.icon}</div>
                                <div class="option-text">
                                    <div class="label">${opt.label}</div>
                                    <div class="desc">${opt.desc}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('prevBtn').style.visibility = currentQuestion === 0 ? 'hidden' : 'visible';
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = !answers[q.id];
            nextBtn.textContent = currentQuestion === questions.length - 1 ? '查看结果' : '下一题';
        }

        function selectOption(questionId, value, element) {
            answers[questionId] = value;
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (!answers[questions[currentQuestion].id]) return;
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResult() {
            document.getElementById('quiz').classList.remove('active');
            document.getElementById('result').classList.add('active');

            // 计算得分
            const scores = {};
            products.forEach(p => scores[p.id] = 0);

            questions.forEach(q => {
                const answer = answers[q.id];
                const matched = q.mapping[answer] || [];
                matched.forEach(productId => {
                    scores[productId] = (scores[productId] || 0) + 1;
                });
            });

            // 排序取前 3
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const topIds = sorted.filter(s => s[1] > 0).slice(0, 3).map(s => s[0]);
            const topProducts = topIds.map(id => products.find(p => p.id === id));

            // 获取用户画像
            const stateLabels = { 'energetic': '精力充沛', 'stressed': '压力较大', 'neutral': '状态平稳', 'focused': '目标明确', 'stuck': '遇到瓶颈' };
            const purposeLabels = { 'wealth': '求财', 'career': '求事业', 'protect': '求护身', 'people': '求人缘', 'self': '求成长' };
            const styleLabels = { 'sweet': '甜美', 'elegant': '优雅', 'cool': '酷飒', 'natural': '文艺', 'luxury': '精致' };

            const resultContainer = document.getElementById('result');
            resultContainer.innerHTML = `
                <div class="result">
                    <div class="result-header">
                        <h2>你的专属水晶已找到</h2>
                        <p>根据 8 道题的测试结果</p>
                    </div>
                    <div class="result-summary">
                        <h4>你的能量画像</h4>
                        <div class="summary-tags">
                            <span class="summary-tag">${stateLabels[answers['current-state']] || ''}</span>
                            <span class="summary-tag">${purposeLabels[answers['purpose']] || ''}</span>
                            <span class="summary-tag">${styleLabels[answers['style']] || ''}</span>
                        </div>
                    </div>
                    ${topProducts.map((p, i) => `
                        <div class="result-card ${i === 0 ? 'featured' : ''}">
                            <img class="card-image" src="${p.image}" alt="${p.name}">
                            <div class="card-body">
                                <h3>
                                    ${p.name}
                                    ${i === 0 ? '<span class="tag">最匹配</span>' : ''}
                                </h3>
                                <div class="material">材质：${p.material}</div>
                                <div class="desc">${p.desc}</div>
                            </div>
                        </div>
                    `).join('')}
                    <button class="btn" onclick="restart()" style="margin-top: 16px;">重新测试</button>
                    <div class="share-tip">
                        分享给朋友，一起找到专属水晶吧 💎
                    </div>
                </div>
            `;
        }

        function restart() {
            currentQuestion = 0;
            answers = {};
            document.getElementById('result').classList.remove('active');
            document.getElementById('landing').classList.add('active');
        }
    </script>
</body>
</html>
