<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FUFU来财 | 找到你的专属水晶</title>
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #c9a96e;
            --accent-light: #e8d5b0;
            --bg: #faf8f5;
            --text: #2d2d2d;
            --text-light: #6b6b6b;
            --card-bg: #ffffff;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .option-icon, .question-emoji, .sparkles, .crystal-ball {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 0 16px 40px;
            min-height: 100vh;
        }
        .page { display: none; }
        .page.active { display: block; }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 0 6px;
            gap: 8px;
        }
        .header img {
            height: 28px;
            width: auto;
        }
        .header .brand {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1px;
        }

        /* Landing Page */
        .landing { text-align: center; padding-top: 8px; }
        .landing .logo-big {
            width: 120px;
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.1));
        }
        .landing .brand-big {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 3px;
            margin-bottom: 4px;
        }
        .landing .tagline {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .landing .benefits {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        .landing .benefits .item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-size: 0.85rem;
            color: var(--text);
        }
        .landing .benefits .item:not(:last-child) {
            border-bottom: 1px solid #f0ece7;
        }
        .landing .benefits .item .icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .landing .hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: var(--accent-light);
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            max-width: 260px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .btn:hover { background: #2d2d4e; }
        .btn:active { transform: scale(0.97); }

        /* Progress Bar */
        .progress { margin: 14px 0; }
        .progress-bar {
            height: 3px;
            background: #e8e4df;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .progress-text {
            text-align: center;
            color: var(--text-light);
            font-size: 0.75rem;
            margin-top: 5px;
        }

        /* Question Page */
        .question-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        .question-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .question-emoji {
            font-size: 2rem;
            flex-shrink: 0;
        }
        .question-num {
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .question-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.45;
        }
        .question-desc {
            font-size: 0.78rem;
            color: var(--text-light);
            margin-bottom: 14px;
        }
        .options { display: flex; flex-direction: column; gap: 8px; }
        .option {
            background: var(--bg);
            border: 1.5px solid transparent;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            outline: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .option:active { transform: scale(0.98); }
        .option.selected {
            border-color: var(--accent);
            background: #faf6ef;
        }
        .option-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
            line-height: 1;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }
        .option-text { flex: 1; }
        .option-text .label { font-weight: 500; margin-bottom: 1px; font-size: 0.88rem; }
        .option-text .desc { font-size: 0.73rem; color: var(--text-light); }
        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
            gap: 10px;
        }
        .btn-secondary {
            background: white;
            color: var(--text);
            border: 1.5px solid #e8e4df;
            padding: 12px 18px;
            border-radius: 50px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }
        .btn-secondary:hover { border-color: var(--accent); }
        .nav-btns .btn { flex: 1.5; }

        /* Result Page */
        .result { text-align: center; }
        .result-header { margin-bottom: 14px; }
        .result-header h2 { color: var(--primary); font-size: 1.15rem; margin-bottom: 4px; }
        .result-header p { color: var(--text-light); font-size: 0.78rem; }
        .result-summary {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }
        .result-summary h4 { margin-bottom: 8px; color: var(--primary); font-size: 0.88rem; }
        .summary-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .summary-tag {
            background: linear-gradient(135deg, var(--accent-light), #f0e6d2);
            border: 1px solid var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            color: var(--primary);
            font-weight: 500;
            letter-spacing: 0.5px;
            animation: tagPop 0.4s ease-out;
        }
        @keyframes tagPop {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .summary-tag:nth-child(2) { animation-delay: 0.1s; }
        .summary-tag:nth-child(3) { animation-delay: 0.2s; }
        .result-card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            text-align: left;
        }
        .result-card.featured {
            border: 1.5px solid var(--accent);
        }
        .result-card .card-image {
            width: 100%;
            display: block;
        }
        .result-card .card-body { padding: 14px; }
        .result-card h3 {
            font-size: 0.98rem;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-card .tag {
            display: inline-block;
            background: var(--accent);
            color: white;
            font-size: 0.63rem;
            padding: 2px 7px;
            border-radius: 8px;
            margin-left: auto;
        }
        .result-card .material {
            color: var(--accent);
            font-weight: 500;
            margin: 6px 0;
            font-size: 0.78rem;
        }
        .result-card .desc {
            color: var(--text-light);
            font-size: 0.78rem;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .share-tip {
            background: #faf6ef;
            border-radius: 10px;
            padding: 12px;
            margin-top: 14px;
            font-size: 0.78rem;
            color: var(--text-light);
        }

        /* Collapsible section */
        .more-products-toggle {
            background: var(--bg);
            border: 1.5px dashed var(--accent-light);
            border-radius: 10px;
            padding: 12px;
            margin-top: 14px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
        }
        .more-products-toggle:hover { background: #faf6ef; }
        .more-products-toggle .arrow { display: inline-block; transition: transform 0.3s; }
        .more-products-toggle .arrow.open { transform: rotate(180deg); }
        .more-products-list {
            display: none;
            margin-top: 12px;
        }
        .more-products-list.show { display: block; }
        .more-products-list .result-card {
            border: 1px solid #e8e4df;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        /* Loading / Animation Page */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--primary);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
        }
        .loading-overlay.active { display: flex; }
        .loading-overlay .crystal-ball {
            font-size: 4rem;
            animation: bounce 0.6s ease-in-out infinite alternate;
        }
        .loading-overlay .blessing-text {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: 700;
            margin-top: 16px;
            animation: pulse 0.8s ease-in-out infinite;
        }
        .loading-overlay .sub-text {
            font-size: 0.85rem;
            color: var(--accent-light);
            margin-top: 8px;
            opacity: 0.8;
        }
        .loading-overlay .sparkles {
            position: absolute;
            font-size: 1.5rem;
            animation: float 2s ease-in-out infinite;
            opacity: 0.6;
        }
        .loading-overlay .sparkles:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .loading-overlay .sparkles:nth-child(2) { top: 20%; right: 15%; animation-delay: 0.3s; }
        .loading-overlay .sparkles:nth-child(3) { bottom: 25%; left: 20%; animation-delay: 0.6s; }
        .loading-overlay .sparkles:nth-child(4) { bottom: 15%; right: 10%; animation-delay: 0.9s; }
        .loading-overlay .sparkles:nth-child(5) { top: 40%; left: 5%; animation-delay: 1.2s; }
        .loading-overlay .sparkles:nth-child(6) { top: 35%; right: 8%; animation-delay: 1.5s; }
        .progress-bar-loading {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-top: 24px;
            overflow: hidden;
        }
        .progress-bar-loading .fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-20px) scale(1.1); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 1; }
        }

        /* Desktop styles */
        @media (min-width: 768px) {
            .container { padding: 0 24px 60px; }
            .header { padding: 20px 0 10px; }
            .header img { height: 36px; }
            .header .brand { font-size: 1.1rem; }
            .landing { padding-top: 20px; }
            .landing .logo-big { width: 160px; margin-bottom: 16px; }
            .landing .brand-big { font-size: 2rem; }
            .landing .tagline { font-size: 1rem; margin-bottom: 28px; }
            .landing .benefits { padding: 24px; }
            .landing .benefits .item { font-size: 0.95rem; padding: 10px 0; }
            .btn { padding: 16px 48px; font-size: 1rem; width: auto; }
            .question-card { padding: 24px 20px; }
            .question-emoji { font-size: 2.4rem; }
            .question-title { font-size: 1.2rem; }
            .question-desc { font-size: 0.88rem; }
            .options { gap: 10px; }
            .option { padding: 14px 16px; }
            .result-header h2 { font-size: 1.4rem; }
            .result-card h3 { font-size: 1.1rem; }
            .result-card .material { font-size: 0.88rem; }
            .result-card .desc { font-size: 0.88rem; }
        }

        @media (min-width: 1024px) {
            .container { max-width: 720px; }
            .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
        </div>

        <!-- Landing Page -->
        <div id="landing" class="page active">
            <div class="landing">
                <img class="logo-big" src="logo.jpg" alt="FUFU来财">
                <div class="tagline">用对水晶，好运自来</div>
                <div class="benefits">
                    <div class="item">
                        <span class="icon">💰</span>
                        <span>招财聚气，事业步步高升</span>
                    </div>
                    <div class="item">
                        <span class="icon">🛡️</span>
                        <span>防小人护身，远离负能量</span>
                    </div>
                    <div class="item">
                        <span class="icon">❤️</span>
                        <span>贵人相助，人缘桃花双丰收</span>
                    </div>
                    <div class="item">
                        <span class="icon">✨</span>
                        <span>提升自信，找回内心松弛感</span>
                    </div>
                </div>
                <div class="hint">🔮 7 道题，找到最适合你的那一款</div>
                <button class="btn" onclick="startQuiz()">开始测水晶</button>
            </div>
        </div>

        <!-- Question Pages -->
        <div id="quiz" class="page">
            <div class="progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>
            <div id="questionContainer"></div>
            <div class="nav-btns">
                <button class="btn-secondary" id="prevBtn" onclick="prevQuestion()">上一题</button>
                <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
            </div>
        </div>

        <!-- Result Page -->
        <div id="result" class="page"></div>
    </div>

    <!-- Loading Animation Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <span class="sparkles">✨</span>
        <span class="sparkles">🔮</span>
        <span class="sparkles">💫</span>
        <span class="sparkles">🌟</span>
        <span class="sparkles">⭐</span>
        <span class="sparkles">🌙</span>
        <div class="crystal-ball" id="crystalEmoji">🔮</div>
        <div class="blessing-text" id="blessingText">正在加持...</div>
        <div class="sub-text" id="subText">水晶正在为你注入能量</div>
        <div class="progress-bar-loading">
            <div class="fill" id="loadingFill"></div>
        </div>
    </div>

    <script>
        // ========== 商品数据库 ==========
        const products = [
            {

            {

            },
            {

            {

        // ========== 问题配置 ==========
        const questions = [
            {

                emoji: '😲',
                title: '最近一段时间，你感觉最困扰的状态是什么？',

                options: [

                ],

                ],
                mapping: {

                    'love': ['people', 'confidence', 'wealth-noble']
                }
            },
            {

                ],
                mapping: {

            },
            {

                title: '你更偏爱哪种颜色？',
                desc: '颜色也有能量，选让你舒服的',
                options: [
                    { icon: '💜', label: '紫色系', desc: '神秘高贵', value: 'purple' },
                    { icon: '💛', label: '金色/黄色系', desc: '富贵温暖', value: 'yellow' },
                    { icon: '🤍', label: '透明/白色系', desc: '纯净清爽', value: 'white' },
                    { icon: '💚', label: '绿色系', desc: '清新自然', value: 'green' },
                    { icon: '⬛', label: '黑色系', desc: '酷感百搭', value: 'black' }
                ],
                mapping: {
                    'purple': ['people'],
                    'yellow': ['wealth-gather', 'confident-wealth', 'execution'],
                    'white': ['purify', 'career', 'steady-wealth'],
                    'green': ['wealth-noble', 'career'],
                    'black': ['protect-dark1', 'protect-dark2', 'protect-wealth']
                }
            },
            {
                id: 'intuition',
                emoji: '🔮',
                title: '凭直觉，选一个此刻最吸引你的词',
                desc: '不用想，选第一个跳出来的',
                options: [
                    { icon: '🌊', label: '流动', desc: '顺势而为、不费力', value: 'flow' },
                    { icon: '🔥', label: '燃烧', desc: '充满能量、想突破', value: 'burn' },
                    { icon: '🌿', label: '生长', desc: '慢慢变好、向上', value: 'grow' },
                    { icon: '🪨', label: '稳定', desc: '扎根当下、不摇摆', value: 'stable' },
                    { icon: '✨', label: '闪耀', desc: '被看见、发光发热', value: 'shine' }
                ],
                mapping: {
                    'flow': ['purify', 'people', 'steady-wealth'],
                    'burn': ['execution', 'confident-wealth', 'wealth-gather'],
                    'grow': ['career', 'wealth-noble', 'confidence'],
                    'stable': ['protect-wealth', 'steady-wealth', 'protect-dark1'],
                    'shine': ['confidence', 'confident-wealth', 'career']
                }
            }
        ];

        // ========== 逻辑控制区 ==========
        let currentQuestion = 0;
        let answers = {};

        function startQuiz() {
            document.getElementById('landing').classList.remove('active');
            document.getElementById('quiz').classList.add('active');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `${currentQuestion + 1} / ${questions.length}`;

            const container = document.getElementById('questionContainer');
            container.innerHTML = `
                <div class="question-card">
                    <div class="question-top">
                        <span class="question-emoji">${q.emoji}</span>
                        <div>
                            <div class="question-num">Question ${currentQuestion + 1}</div>
                            <div class="question-title">${q.title}</div>
                        </div>
                    </div>
                    <div class="question-desc">${q.desc}</div>
                    <div class="options">
                        ${q.options.map((opt) => `
                            <div class="option ${answers[q.id] === opt.value ? 'selected' : ''}" onclick="selectOption('${q.id}', '${opt.value}', this)">
                                <div class="option-icon">${opt.icon}</div>
                                <div class="option-text">
                                    <div class="label">${opt.label}</div>
                                    <div class="desc">${opt.desc}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('prevBtn').style.visibility = currentQuestion === 0 ? 'hidden' : 'visible';
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = !answers[q.id];
            nextBtn.textContent = currentQuestion === questions.length - 1 ? '查看结果' : '下一题';
        }

        function selectOption(questionId, value, element) {
            answers[questionId] = value;
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (!answers[questions[currentQuestion].id]) return;
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResult() {
            // Show "submitting" animation first, then blessing animation
            showSubmittingAnimation();
        }

        function showSubmittingAnimation() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');

            // Phase 1: Submitting
            document.getElementById('crystalEmoji').textContent = '📝';
            document.getElementById('blessingText').textContent = '正在提交答案...';
            document.getElementById('subText').textContent = '请稍候';
            document.getElementById('loadingFill').style.width = '20%';

            setTimeout(() => {
                // Phase 2: Blessing animation
                showLoadingAnimation();
            }, 800);
        }

        function showLoadingAnimation() {
            const blessings = [
                { emoji: '🔮', text: '正在开光...', sub: '水晶灵性已激活' },
                { emoji: '✨', text: '正在加持...', sub: '为你注入正能量' },
                { emoji: '🙏', text: '正在祈福...', sub: '加持好运Buff' },
                { emoji: '💫', text: '能量加载中...', sub: '水晶与你正在共振' },
                { emoji: '🌟', text: '即将完成...', sub: '你的专属水晶已找到' }
            ];

            let step = 0;
            const totalSteps = blessings.length;
            const interval = 600;

            const updateBlessing = () => {
                if (step < totalSteps) {
                    document.getElementById('crystalEmoji').textContent = blessings[step].emoji;
                    document.getElementById('blessingText').textContent = blessings[step].text;
                    document.getElementById('subText').textContent = blessings[step].sub;
                    document.getElementById('loadingFill').style.width = (20 + (step + 1) / totalSteps * 80) + '%';
                    step++;
                    setTimeout(updateBlessing, interval);
                } else {
                    const overlay = document.getElementById('loadingOverlay');
                    overlay.classList.remove('active');
                    renderResultPage();
                }
            };

            updateBlessing();
        }

        function renderResultPage() {
            document.getElementById('quiz').classList.remove('active');
            document.getElementById('result').classList.add('active');

            // 计算得分
            const scores = {};
            products.forEach(p => scores[p.id] = 0);

            questions.forEach(q => {
                const answer = answers[q.id];
                const matched = q.mapping[answer] || [];
                matched.forEach(productId => {
                    scores[productId] = (scores[productId] || 0) + 1;
                });
            });

            // 排序取前 3
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const allSorted = sorted.filter(s => s[1] > 0);
            const topIds = allSorted.slice(0, 3).map(s => s[0]);
            const topProducts = topIds.map(id => products.find(p => p.id === id));
            const restProducts = allSorted.slice(3).map(s => products.find(p => p.id === s[0]));

            // 存储所有商品供折叠使用
            window._restProducts = restProducts;

            // 获取用户画像
            const troubleLabels = { 'anxiety': '情绪敏感', 'money': '求财心切', 'obstacle': '阻力较大', 'lost': '方向迷茫', 'tired': '身心疲惫' };
            const troubleIcons = { 'anxiety': '🌀', 'money': '💸', 'obstacle': '🧱', 'lost': '😶', 'tired': '😫' };
            const wishLabels = { 'rich': '求财富', 'success': '求事业', 'safe': '求护身', 'happy': '求开心', 'love': '求人缘' };
            const wishIcons = { 'rich': '💰', 'success': '🚀', 'safe': '🛡', 'happy': '😊', 'love': '💗' };
            const mbtiLabels = { 'F': '感性F人', 'T': '理性T人', 'N': '直觉N人', 'S': '实感S人' };
            const mbtiIcons = { 'F': '💭', 'T': '', 'N': '✨', 'S': '' };

            const resultContainer = document.getElementById('result');
            resultContainer.innerHTML = `
                <div class="result">
                    <div class="result-header">
                        <h2>你的专属水晶已找到</h2>
                        <p>根据 7 道题的测试结果</p>
                    </div>
                    <div class="result-summary">
                        <h4>你的能量画像</h4>
                        <div class="summary-tags">
                            ${[
                                { icon: troubleIcons[answers['trouble']] || '', text: troubleLabels[answers['trouble']] },
                                { icon: mbtiIcons[answers['mbti']] || '', text: mbtiLabels[answers['mbti']] },
                                { icon: wishIcons[answers['wish']] || '', text: wishLabels[answers['wish']] }
                            ].filter(t => t.text).map(t => `<span class="summary-tag">${t.icon} ${t.text}</span>`).join('')}
                        </div>
                    </div>
                    ${topProducts.map((p, i) => `
                        <div class="result-card ${i === 0 ? 'featured' : ''}">
                            <img class="card-image" src="${p.image}" alt="${p.name}">
                            <div class="card-body">
                                <h3>
                                    ${p.name}
                                    ${i === 0 ? '<span class="tag">最匹配</span>' : ''}
                                </h3>
                                <div class="material">材质：${p.material}</div>
                                <div class="desc">${p.desc}</div>
                            </div>
                        </div>
                    `).join('')}
                    ${restProducts.length > 0 ? `
                        <div class="more-products-toggle" onclick="toggleMoreProducts()">
                            <span class="arrow">▼</span> 查看更多商品
                        </div>
                        <div class="more-products-list" id="moreProductsList">
                            ${restProducts.map(p => `
                                <div class="result-card">
                                    <img class="card-image" src="${p.image}" alt="${p.name}">
                                    <div class="card-body">
                                        <h3>${p.name}</h3>
                                        <div class="material">材质：${p.material}</div>
                                        <div class="desc">${p.desc}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    <button class="btn" onclick="restart()" style="margin-top: 16px;">重新测试</button>
                    <div class="share-tip">
                        分享给朋友，一起找到专属水晶吧 💎
                    </div>
                </div>
            `;
        }

        function restart() {
            currentQuestion = 0;
            answers = {};
            document.getElementById('result').classList.remove('active');
            document.getElementById('landing').classList.add('active');
        }

        function toggleMoreProducts() {
            const list = document.getElementById('moreProductsList');
            const toggle = document.querySelector('.more-products-toggle');
            const arrow = toggle.querySelector('.arrow');
            if (list.classList.contains('show')) {
                list.classList.remove('show');
                toggle.innerHTML = '<span class="arrow">▼</span> 查看更多商品';
            } else {
                list.classList.add('show');
                toggle.innerHTML = '<span class="arrow open">▲</span> 收起';
            }
        }
    </script>
